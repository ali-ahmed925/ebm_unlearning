seed: 42
device: cuda

# ── LoRA variant ──────────────────────────────────────────────────────────────
# IDENTICAL to config_domainnet_subset_hivram.yaml (the prop run) EXCEPT the
# unlearn checkpoint name. LoRA settings (targets/rank/alpha) are passed on the
# CLI to run_unlearn_lora_domainnet.py, not here, so one config serves a sweep.
# Backbone is frozen and adapted only by LoRA adapters; finetune_stages is
# ignored by the LoRA runner (inject_lora freezes the backbone regardless).
# Reuses the existing pretrained checkpoint (read-only). New checkpoint name so
# nothing existing is overwritten.
# Run:  python run_unlearn_lora_domainnet.py --config configs/config_ours_lora.yaml \
#         --mask-mode cross-class --lora-targets layer4 --lora-rank 8 --lora-alpha 16
# Eval: python analyze_similarity_degradation.py --config configs/config_domainnet_subset_hivram.yaml \
#         --unlearned outputs/checkpoints/ebm_unlearned_subset_lora.pt
# ──────────────────────────────────────────────────────────────────────────────

data:
  dataset: domainnet
  data_dir: ./data/domainnet/DomainNet
  domains: [real, sketch, clipart, painting]
  classes: [The_Eiffel_Tower, aircraft_carrier, bed, car, cat, ceiling_fan, dog, donut, dragon, dresser, fireplace, floor_lamp, hourglass, house, knee, lightning, lion, pliers, raccoon, rifle, scissors, snail, streetlight, tiger, tractor, umbrella]
  batch_size: 32
  num_workers: 6
  forget:
    mode: class_domain
    class_label: 23        # tiger index in sorted(classes)
    class_name: tiger
    domain: sketch
  retain:
    mode: complement

model:
  name: energy_model
  backbone: resnet18
  imagenet_pretrained: true
  finetune_stages: 1       # ignored by the LoRA runner (backbone frozen by inject_lora)
  in_channels: 3
  hidden_dim: 64
  num_classes: 26
  embed_dim: 128

pretrain:
  epochs: 50
  lr: 1.0e-4
  weight_decay: 0.0
  margin: 1.0
  k_neg: 10
  neg_chunk: 5
  val_fraction: 0.1
  early_stopping:
    enabled: true
    patience: 8
    min_delta: 0.001
    mode: max
  log_every: 100
  checkpoint_path: outputs/checkpoints/ebm_pretrained_domainnet_subset.pt   # REUSED, read-only

unlearning:
  steps: 1500
  lr: 1.0e-4
  weight_decay: 0.0
  lambda_f: 1.0
  lambda_r: 15.0
  lambda_m: 1.0
  lambda_e: 1.0e-3
  lambda_clip: 3.0
  n_pca_components: 5
  margin: 5.0
  log_every: 50
  checkpoint_path: outputs/checkpoints/ebm_unlearned_subset_lora.pt   # NEW name — nothing overwritten

evaluation:
  holdout_fraction: 0.2
