seed: 42
device: cuda

data:
  dataset: cifar100
  data_dir: ./data
  batch_size: 16
  num_workers: 2
  forget:
    mode: class
    class_label: 58    # rocket
  retain:
    mode: complement

model:
  name: energy_model
  backbone: resnet18
  imagenet_pretrained: true
  finetune_stages: 2     # layer3 + layer4
  in_channels: 3
  hidden_dim: 64
  num_classes: 100
  embed_dim: 128

pretrain:
  epochs: 50
  lr: 1.0e-3
  weight_decay: 0.0
  margin: 1.0
  k_neg: 10
  neg_chunk: 5
  val_fraction: 0.1
  early_stopping:
    enabled: true
    patience: 8
    min_delta: 0.001
    mode: max
  log_every: 100
  checkpoint_path: outputs/checkpoints/ebm_pretrained_cifar100.pt

unlearning:
  steps: 700
  lr: 1.0e-4
  weight_decay: 0.0
  lambda_f: 1.0
  lambda_r: 30.0
  lambda_m: 1.0
  lambda_e: 1.0e-3
  margin: 5.0
  neg_k_forget: 20   # 20 random negatives — enough coverage without 99x gradient pressure
  log_every: 50
  checkpoint_path: outputs/checkpoints/cifar100_unlearned_placeholder.pt  # overridden at runtime

evaluation:
  holdout_fraction: 0.2
